version: '3.8'

services:
  # Backend Tomcat service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - EMAIL=webmarket.we@outlook.com
      - EMAIL_PASSWORD=webmarket1234
    volumes:
      - ./context.xml:/usr/local/tomcat/conf/Catalina/localhost/webmarket.xml
    networks:
      - webmarket-network
    restart: always

  # Database service (MySQL)
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=webmarket
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql
      - ./init-db:/docker-entrypoint-initdb.d/02-additional-data
    networks:
      - webmarket-network
    restart: always

networks:
  webmarket-network:
    driver: bridge

volumes:
  mysql-data: